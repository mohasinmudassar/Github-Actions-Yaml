name: Deploy Angular App to S3

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "18"
      angular-cli-version:
        description: "Angular CLI version to install"
        required: false
        type: string
        default: "17"
      build-configuration:
        description: "ng build configuration to use"
        required: false
        type: string
        default: "production"
      source-dir:
        description: "Build output directory to sync to S3"
        required: false
        type: string
        default: "dist"
      s3-bucket:
        description: "Target S3 bucket name"
        required: true
        type: string
      aws-region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      cloudfront-distribution-id:
        description: "CloudFront distribution ID to invalidate after deploy (leave empty to skip)"
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli@${{ inputs.angular-cli-version }}

      - name: Build Angular app
        run: ng build --configuration=${{ inputs.build-configuration }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy to S3
        run: aws s3 sync ${{ inputs.source-dir }} s3://${{ inputs.s3-bucket }} --delete

      - name: Invalidate CloudFront cache
        if: inputs.cloudfront-distribution-id != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ inputs.cloudfront-distribution-id }} --paths '/*'
